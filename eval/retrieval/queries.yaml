# Each entry:
#   id:         unique, kebab-case
#   query:      English, as the agent would write it, at most 300 characters
#   expected:   policy_ids that must all be in the top 3; [] = out of scope, NO_MATCH expected
#   source:     written | email (taken from a test email's wording)
#   case:       the email's id when source is email, else null
#   written_by: owner | claude | mentor
#               (mentor: written in the owner's review chat without reading policies.md)
#   split:      dev | held_out (about 30% held out, in scope and out of scope separately)
#   note:       optional
#
# Extra relevant ids in the top 3 are not counted wrong.

