[project]
name = "anemos"
version = "0.1.0"
description = "Reservations inbox agent for the fictional Hotel Anemos: drafts replies, owner approves."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.163.0",
    "langgraph>=1.2.19",
    "langgraph-checkpoint-postgres>=3.2.0",
    "openai>=3.51.0",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[build-system]
# uv's own build backend; used only to install the package (src/ layout).
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # import order
    "B",   # bugbear (likely bugs)
    "UP",  # pyupgrade (modern syntax)
    "SIM", # simplifications
    "RUF", # ruff-specific checks
    "DTZ", # no naive datetimes (D23: everything timezone-aware)
    "TID251", # banned APIs, see below
]

# D20: only the injected clock may read the system time.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "Use an injected Clock (anemos.clock), see D20."
"datetime.datetime.utcnow".msg = "Use an injected Clock (anemos.clock), see D20."
"datetime.datetime.today".msg = "Use an injected Clock (anemos.clock), see D20."
"datetime.date.today".msg = "Use an injected Clock (anemos.clock), see D20."
"time.time".msg = "Use an injected Clock (anemos.clock), see D20."

[tool.ruff.lint.per-file-ignores]
"src/anemos/clock.py" = ["TID251"]  # the one place allowed to read the system time
# Tests assert bilingual EN/EL output, so Greek letters, the euro/multiplication signs
# and no-break spaces in strings are intended there. src/ stays strict: guest
# wording lives in reservations/templates/, not in Python strings.
"tests/**" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests", "eval"]
# If a library forces relaxing strict mode, do it per module below with a comment saying why.

[tool.alembic]
# Migrations live inside the package so they ship with the code.
script_location = "%(here)s/src/anemos/db/migrations"
# New revision files are named <rev>_<slug>.py, e.g. 0002_inventory.py (use --rev-id 0002).
file_template = "%%(rev)s_%%(slug)s"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-ra", "--import-mode=importlib"]
markers = [
    "unit: no database, no network",
    "integration: needs the local Postgres service",
    "slow: starts several processes (seconds); CI runs them, a quick local loop may skip them",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "hypothesis>=6.170.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-repeat>=0.9.4",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261113",
]

# Releases younger than two weeks are the supply-chain risk window: the langgraph family
# and the packages it brings are resolved as of 2026-11-03 (NOTES 2026-11-17).
[tool.uv.exclude-newer-package]
langgraph = "2026-11-03T00:00:00Z"
langgraph-checkpoint = "2026-11-03T00:00:00Z"
langgraph-prebuilt = "2026-11-03T00:00:00Z"
langgraph-sdk = "2026-11-03T00:00:00Z"
langchain-core = "2026-11-03T00:00:00Z"
langchain-protocol = "2026-11-03T00:00:00Z"
langsmith = "2026-11-03T00:00:00Z"
jsonpatch = "2026-11-03T00:00:00Z"
jsonpointer = "2026-11-03T00:00:00Z"
xxhash = "2026-11-03T00:00:00Z"
ormsgpack = "2026-11-03T00:00:00Z"
langgraph-checkpoint-postgres = "2026-11-03T00:00:00Z"
psycopg-pool = "2026-11-03T00:00:00Z"
